# Tool configuration only — this project is a flat set of scripts run by cron,
# not an installable package, so there is no [project] metadata or build backend.

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Deliberately narrow. F is the rule set that pays for itself here — undefined
# names, unused imports, f-strings with missing placeholders — i.e. exactly the
# bugs that otherwise wait a week for the cron to find them. E9 catches syntax
# and IO errors. E4/E7/W/UP are cheap and quiet.
#
# flake8-bugbear (B) is left OFF on purpose: its useful checks (B006 mutable
# default args) have nothing to catch in this codebase, while B023 fires on the
# immediately-invoked closures used throughout and B905 wants strict= on every
# zip. A linter that reports things worth ignoring stops being read at all, and
# this one needs to stay a real signal.
select = ["F", "E4", "E7", "E9", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
