name: CI

# Runs on every push and PR. The weekly cron is the only other place this code
# executes, and it runs once a week against live sites — far too slow a feedback
# loop to discover that a name is undefined. Lint + unit tests here instead.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "shortlists/**"
      - "docs/**"
      - "seen_books.db"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (undefined names, unused imports, bad f-strings)
        run: ruff check .

      - name: Unit tests
        run: pytest
