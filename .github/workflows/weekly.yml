name: Weekly Book Filter

on:
  schedule:
    # Every Sunday at 23:00 UTC (6 PM CDT / 5 PM CST — drifts by 1h with DST)
    - cron: "0 23 * * 0"
  workflow_dispatch: # Allow manual runs

concurrency:
  group: book-pipeline
  cancel-in-progress: false

jobs:
  filter-books:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run book filter
        env:
          BOOK_RECIPIENT: ${{ secrets.BOOK_RECIPIENT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python main.py

      - name: Commit shortlist, database, and catalog to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shortlists/ seen_books.db docs/
          git diff --cached --quiet || git commit -m "Update shortlist and database for $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
      # NOTE: Enable GitHub Pages once after merging this PR:
      # Repo Settings → Pages → Source: Deploy from branch → Branch: main, Folder: /docs
