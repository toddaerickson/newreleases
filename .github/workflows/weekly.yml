name: Weekly Book Filter

on:
  schedule:
    # Every Sunday at 23:00 UTC (6 PM CDT / 5 PM CST — drifts by 1h with DST)
    - cron: "0 23 * * 0"
  workflow_dispatch: # Allow manual runs

jobs:
  filter-books:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download previous database
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: seen-books-db
          path: .
        continue-on-error: true  # First run won't have an artifact

      - name: Run book filter
        env:
          BOOK_RECIPIENT: ${{ secrets.BOOK_RECIPIENT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python main.py

      - name: Upload database for next run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seen-books-db
          path: seen_books.db
          retention-days: 400
          overwrite: true

      - name: Upload shortlist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shortlist-${{ github.run_number }}
          path: shortlists/
          retention-days: 90

      - name: Commit shortlist to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shortlists/
          git diff --cached --quiet || git commit -m "Add shortlist for $(date +%Y-%m-%d)"
          git push
