name: Monthly Book Digest

on:
  schedule:
    # 1st of each month at 15:00 UTC (10 AM CDT / 9 AM CST)
    - cron: "0 15 1 * *"
  workflow_dispatch: # Allow manual runs

concurrency:
  group: book-pipeline
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify database exists
        run: |
          if [ ! -f seen_books.db ]; then
            echo "::error::seen_books.db not found in repo — weekly workflow may not have run yet"
            exit 1
          fi

      - name: Send monthly digest
        env:
          BOOK_RECIPIENT: ${{ secrets.BOOK_RECIPIENT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python digest.py
