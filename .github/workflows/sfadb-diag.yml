name: sfadb diagnostic (temporary)
on:
  push:
    branches: ["claude/festive-archimedes-7psmrn"]
    paths: [".github/workflows/sfadb-diag.yml"]
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Runner egress IP
        run: curl -sS --max-time 15 https://api.ipify.org; echo
      - name: DNS
        run: |
          for h in www.sfadb.com sfadb.com; do echo "== $h"; getent ahosts $h || true; dig +short A $h; dig +short AAAA $h; done
      - name: TCP connect (443 and 80), 30s
        run: |
          for h in www.sfadb.com sfadb.com; do for p in 443 80; do
            s=$(date +%s.%N); if timeout 30 bash -c "</dev/tcp/$h/$p" 2>/dev/null; then r=OK; else r=FAIL; fi
            echo "$h:$p $r $(echo "$(date +%s.%N)-$s" | bc)s"; done; done
      - name: curl, 60s connect timeout, IPv4 / IPv6 / http
        run: |
          UA="NewReleaseBookFilter/1.0 (+https://github.com/toddaerickson/newreleases)"
          for args in "-4 https://www.sfadb.com/2026_Results" "-6 https://www.sfadb.com/2026_Results" \
                      "-4 https://sfadb.com/2026_Results" "-4 http://www.sfadb.com/2026_Results" \
                      "-4 https://www.sfadb.com/" ; do
            echo "== curl $args"
            curl -sS $args -A "$UA" --connect-timeout 60 --max-time 120 -o body.html \
              -w "http=%{http_code} ip=%{remote_ip} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s size=%{size_download}\n" || true
            [ -f body.html ] && { echo "chronowinsblock: $(grep -c chronowinsblock body.html)"; head -c 300 body.html; echo; rm -f body.html; }
          done
      - name: curl with browser UA
        run: |
          curl -sS -4 https://www.sfadb.com/2026_Results --connect-timeout 60 --max-time 120 -o body.html \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" \
            -w "http=%{http_code} connect=%{time_connect}s total=%{time_total}s size=%{size_download}\n" || true
          [ -f body.html ] && echo "chronowinsblock: $(grep -c chronowinsblock body.html)"
      - name: Path to host
        run: |
          sudo apt-get install -y -qq traceroute >/dev/null 2>&1 || true
          sudo traceroute -T -p 443 -n -w 2 -q 1 -m 25 www.sfadb.com || true
      - name: Control (Wikipedia)
        run: curl -sS -4 -o /dev/null -w "wikipedia http=%{http_code} connect=%{time_connect}s\n" --max-time 30 https://en.wikipedia.org/
